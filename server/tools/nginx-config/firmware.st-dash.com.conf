# HTTP重定向到HTTPS
server {
    listen 80;
    server_name firmware.st-dash.com;
    
    # 重定向到HTTPS
    return 301 https://$server_name$request_uri;
}

# HTTPS域名访问
server {
    listen 443 ssl http2;
    server_name firmware.st-dash.com;
    
    # SSL证书配置
    ssl_certificate /etc/letsencrypt/live/firmware.st-dash.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/firmware.st-dash.com/privkey.pem;
    
    # SSL安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # 安全头
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "hid=(self), camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    # 代理到Node.js应用
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # 静态文件缓存
    location /downloads/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Authorization $http_authorization;
        add_header Cache-Control "private, no-store" always;
    }
    
    # 健康检查
    location /health {
        proxy_pass http://127.0.0.1:3000;
        access_log off;
    }
}

# Node 生产环境必须同时设置：
# LISTEN_HOST=127.0.0.1
# TRUST_PROXY_HOPS=1
# 端口 3000 不得通过公网防火墙暴露。
